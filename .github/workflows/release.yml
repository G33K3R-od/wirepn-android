name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            chmod 600 "${RUNNER_TEMP}/release.keystore"
            echo "path=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_OUTPUT}"
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            echo "Using repository **release signing** (upload key) for this build." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "No \`RELEASE_KEYSTORE_BASE64\` secret — using **CI debug keystore** for a sideload-friendly APK." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Assemble release APK
        env:
          CI: "true"
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirepn-android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Load release notes file (tags only)
        id: relnotes
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          FILE="RELEASE_NOTE_${TAG}.md"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if [ -f "${FILE}" ]; then
            echo "has_file=true" >> "${GITHUB_OUTPUT}"
            echo "path=${FILE}" >> "${GITHUB_OUTPUT}"
          else
            echo "has_file=false" >> "${GITHUB_OUTPUT}"
            echo "No \`${FILE}\` in repo; release body will use GitHub-generated notes from commits." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Create GitHub Release (tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: ${{ steps.relnotes.outputs.has_file == 'true' && steps.relnotes.outputs.path || '' }}
          generate_release_notes: ${{ steps.relnotes.outputs.has_file != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
